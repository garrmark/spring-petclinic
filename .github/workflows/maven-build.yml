# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-java-with-maven
# lineai-intelligence-build-feedback
# lineai-intelligence-source-scan

name: Java CI with Maven

on:
  push:
    branches: [ main, lineai-baseline, 'lineai/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: self-hosted
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{matrix.java}}
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.java}}
          distribution: 'adopt'
          cache: maven
      - name: Build with Maven Wrapper
        env:
          NO_COLOR: "1"
          TERM: dumb
        run: |
          set -o pipefail
          ./mvnw -B verify 2>&1 | tee "${{ github.workspace }}/build.log"


      # Lab-only (prodsim-tng Recipe A): self-hosted runner + private CA bundle
      - name: Prep lab CA bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="${{ runner.temp }}/lab-ca-bundle.pem"
          HOST_CA=/usr/local/share/ca-certificates/prodsim-tng-local-ca.crt
          : > "$BUNDLE"
          if [[ -f "$HOST_CA" ]]; then
            cat "$HOST_CA" >> "$BUNDLE"
          fi
          HOST="tng.127.0.0.1.nip.io"
          openssl s_client -showcerts -connect "${HOST}:443" -servername "$HOST" </dev/null 2>/dev/null             | awk '/BEGIN CERTIFICATE/,/END CERTIFICATE/{print}' >> "$BUNDLE" || true
          if ! grep -q "BEGIN CERTIFICATE" "$BUNDLE"; then
            curl -sf http://127.0.0.1:9090/api/ca.pem >> "$BUNDLE" || true
          fi
          # Assert a self-signed root is present
          python3 - <<'PY2'
          import re,sys
          from pathlib import Path
          pem=Path(r"""${{ runner.temp }}/lab-ca-bundle.pem""").read_text()
          certs=re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", pem, re.S)
          if not certs:
            sys.exit("lab CA bundle empty")
          print(f"lab CA bundle has {len(certs)} cert(s)")
          PY2
          echo "LAB_CA_BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          # JVM truststore for the java scanner container mount path below
          TS="${{ runner.temp }}/lab-truststore.jks"
          rm -f "$TS"
          keytool -importcert -noprompt -alias labca -file "$HOST_CA" -keystore "$TS" -storepass changeit 2>/dev/null             || keytool -importcert -noprompt -alias labca -file <(openssl x509 -in "$BUNDLE") -keystore "$TS" -storepass changeit
          echo "LAB_TRUSTSTORE=$TS" >> "$GITHUB_ENV"

      - name: Ensure Lineai build.log exists
        if: always()
        shell: bash
        run: |
          if [ ! -f "${{ github.workspace }}/build.log" ]; then
            echo "No teed build.log found; a step may have failed before log capture." > "${{ github.workspace }}/build.log"
            echo "Workflow: ${{ github.workflow }}" >> "${{ github.workspace }}/build.log"
            echo "Job status: ${{ job.status }}" >> "${{ github.workspace }}/build.log"
          fi

      - name: Send Lineai Build Info
        if: always()
        shell: bash
        env:
          LINEAI_HOST: ${{ vars.LINEAI_HOST }}
          AGENT_UUID: ${{ vars.AGENT_UUID }}
          AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
          CURL_CA_BUNDLE: ${{ env.LAB_CA_BUNDLE }}
          SSL_CERT_FILE: ${{ env.LAB_CA_BUNDLE }}
        run: |
          docker run --pull always --rm --network host \
            --env LINEAI_HOST --env AGENT_UUID --env AGENT_PASSWORD \
            --env CURL_CA_BUNDLE --env SSL_CERT_FILE \
            --volume "${{ github.workspace }}:/github/workspace" \
            --volume "${{ env.LAB_CA_BUNDLE }}:${{ env.LAB_CA_BUNDLE }}:ro" \
            lineaipublic.azurecr.io/lineai_send-build-info:latest \
            send_build_info \
              --path=/github/workspace \
              --pipeline-system="GitHub Actions" \
              --job-name="${{ github.workflow }}" \
              --build-number="${{ github.run_number }}" \
              --build-status="${{ job.status }}" \
              --log-file=/github/workspace/build.log

      - name: Lineai Java source scan
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/lineai-baseline'
        env:
          LINEAI_HOST: ${{ vars.LINEAI_HOST }}
          AGENT_UUID: ${{ vars.AGENT_UUID }}
          AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
          JAVA_METHOD_FILTER: "org.springframework.samples."
        run: |
          docker run --pull always --rm --network host \
            --env LINEAI_HOST --env AGENT_UUID --env AGENT_PASSWORD --env JAVA_METHOD_FILTER \
            --env SCAN_PATH_FILTER=java --env SCAN_PATH_DEPTH=-1 \
            --env JAVA_TOOL_OPTIONS="-Djavax.net.ssl.trustStore=/lab-truststore.jks -Djavax.net.ssl.trustStorePassword=changeit" \
            --volume "${{ github.workspace }}:/scan" \
            --volume "${{ env.LAB_TRUSTSTORE }}:/lab-truststore.jks:ro" \
            --entrypoint /bin/bash \
            lineaipublic.azurecr.io/lineai_source_java:latest \
            -c 'set -euo pipefail
                printf "%s\n" "${AGENT_UUID}" > /sourceCape-agent-uuid
                printf "%s\n" "${AGENT_UUID}" > /sourceCape-agent-creds
                printf "%s\n" "${AGENT_PASSWORD}" >> /sourceCape-agent-creds
                printf "%s\n" "${AGENT_UUID}" > /jCape-agent-uuid
                printf "%s\n" "${AGENT_UUID}" > /jCape-agent-creds
                printf "%s\n" "${AGENT_PASSWORD}" >> /jCape-agent-creds
                method_filter_args=()
                if [[ -n "${JAVA_METHOD_FILTER:-}" ]]; then
                  method_filter_args=(--method-filter "${JAVA_METHOD_FILTER}")
                fi
                exec /opt/entrypoint.sh analyze --type FILE \
                  --application "${{ github.event.repository.name }}" \
                  --scan-space-name "${{ github.event.repository.html_url }}|OnboardingBaselineScanSpace" \
                  --path /scan "${method_filter_args[@]}" --rescan'
